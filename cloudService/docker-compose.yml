version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: cloud-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d cloud_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
     - cloud-network

  backend:
    build: .
    container_name: cloud-backend
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloud_db
      DB_USER: user
      DB_PASSWORD: password
      FILE_STORAGE_PATH: /app/files
    volumes:
      - ./app-files:/app/files
      - ./app-logs:/app/logs
    networks:
      - cloud-network

  nginx:
    image: nginx:alpine
    container_name: cloud-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cloud-network

volumes:
  postgres-data:

networks:
  cloud-network:
    driver: bridge